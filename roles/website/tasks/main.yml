---
- name: Ensure static website directory exists
  ansible.builtin.file:
    path: "{{ moodle_web_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install a minimal placeholder only when no source website has been staged
  ansible.builtin.copy:
    dest: "{{ moodle_web_dir }}/index.html"
    owner: root
    group: root
    mode: "0644"
    force: false
    content: |
      <!doctype html>
      <html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lingga Ramadhan</title></head>
      <body><main><h1>Lingga Ramadhan</h1><p>Website berhasil dipindahkan ke Server A.</p></main></body></html>
