---
- name: Install Docker Engine and Compose plugin from Ubuntu packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - python3-docker
    state: present
    update_cache: true

- name: Enable Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Create Moodle root directory
  ansible.builtin.file:
    path: "{{ moodle_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
