# Grafana native package/service, not a container.
- name: Download Grafana repository signing key
  ansible.builtin.get_url:
    url: "{{ grafana_repo_key }}"
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: "0644"

- name: Add Grafana APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    filename: grafana
    state: present

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true
  notify: Restart Grafana

- name: Configure Grafana server binding
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^\s*;?\s*{{ item.key }}\s*='
    line: "{{ item.key }} = {{ item.value }}"
    insertafter: '^\[server\]'
  loop:
    - key: http_addr
      value: "{{ server_ip }}"
    - key: http_port
      value: "{{ grafana_port }}"
    - key: domain
      value: "{{ grafana_domain }}"
    - key: root_url
      value: "http://{{ server_ip }}:{{ grafana_port }}/"
  notify: Restart Grafana

- name: Ensure Grafana provisioning directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: grafana
    mode: "0750"
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /var/lib/grafana/dashboards

- name: Configure Grafana dashboard provider
  ansible.builtin.template:
    src: grafana-dashboard-provider.yml.j2
    dest: /etc/grafana/provisioning/dashboards/ansible.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana

- name: Install Server A application and database dashboard
  ansible.builtin.template:
    src: serverA-dashboard.json.j2
    dest: /var/lib/grafana/dashboards/serverA-moodle.json
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana

- name: Install Server B monitoring dashboard
  ansible.builtin.template:
    src: serverB-dashboard.json.j2
    dest: /var/lib/grafana/dashboards/serverB-monitoring.json
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana

- name: Configure Grafana Prometheus datasource
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana

- name: Set Grafana admin password
  no_log: true
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?admin_password\s*='
    line: "admin_password = {{ grafana_admin_password }}"
    insertafter: '^\[security\]'
  notify: Restart Grafana

- name: Flush service handlers before enabling services
  ansible.builtin.meta: flush_handlers

- name: Enable and start monitoring services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - node_exporter
    - prometheus
    - alertmanager
    - blackbox_exporter
    - grafana-server

- name: Verify local monitoring endpoints
  ansible.builtin.uri:
    url: "{{ item }}"
    status_code: 200
    return_content: false
  loop:
    - "http://{{ server_ip }}:{{ prometheus_port }}/-/healthy"
    - "http://{{ server_ip }}:{{ alertmanager_port }}/-/healthy"
    - "http://{{ server_ip }}:{{ blackbox_exporter_port }}/"

# Read-only peer endpoint checks from Server A. These tasks do not SSH to or
# configure Server B; they only verify that its owner-provided exporters answer.
- name: Verify Server B Node Exporter metrics endpoint
  ansible.builtin.uri:
    url: "http://{{ peer_node_exporter_target }}/metrics"
    method: GET
    status_code: 200
    return_content: false
    timeout: 5
  changed_when: false
  failed_when: false

- name: Verify Server B MariaDB Exporter metrics endpoint
  ansible.builtin.uri:
    url: "http://{{ peer_mariadb_exporter_target }}/metrics"
    method: GET
    status_code: 200
    return_content: false
    timeout: 5
  changed_when: false
  failed_when: false
  when: peer_mariadb_monitor_enabled | bool
