---
- name: Install Bind9 packages on the host
  ansible.builtin.apt:
    name:
      - bind9
      - bind9-utils
      - dnsutils
    state: present
    update_cache: true

- name: Deploy Bind9 options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: "{{ bind_config_dir }}/named.conf.options"
    owner: root
    group: bind
    mode: "0644"
  notify: Validate and reload Bind9

- name: Deploy authoritative zone declarations
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: "{{ bind_config_dir }}/named.conf.local"
    owner: root
    group: bind
    mode: "0644"
  notify: Validate and reload Bind9

- name: Deploy forward DNS zone
  ansible.builtin.template:
    src: db.domain.j2
    dest: "{{ bind_zone_file }}"
    owner: root
    group: bind
    mode: "0644"
  notify: Validate and reload Bind9

- name: Deploy reverse DNS zone
  ansible.builtin.template:
    src: db.reverse.j2
    dest: "{{ bind_reverse_file }}"
    owner: root
    group: bind
    mode: "0644"
  notify: Validate and reload Bind9

- name: Validate Bind9 configuration before applying changes
  ansible.builtin.command: named-checkconf
  changed_when: false

- name: Validate forward zone
  ansible.builtin.command: "named-checkzone {{ bind_zone_name }} {{ bind_zone_file }}"
  changed_when: false

- name: Validate reverse zone
  ansible.builtin.command: "named-checkzone {{ bind_reverse_zone }} {{ bind_reverse_file }}"
  changed_when: false

- name: Ensure Bind9 is enabled and running
  ansible.builtin.systemd:
    name: "{{ bind_service }}"
    enabled: true
    state: started
