---
- name: Prepare the local MariaDB container for a controlled Moodle restore
  hosts: serverA
  become: true
  gather_facts: false
  tasks:
    - name: Confirm this play targets Server A only
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'serverA'
          - server_role == 'primary'

    - name: Require protected database credentials
      ansible.builtin.assert:
        that:
          - vault_moodle_db_root_password is defined
          - vault_moodle_db_password is defined
      no_log: true

    - name: Ensure Compose bind-mount directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ moodle_code_dir }}"
        - "{{ moodle_data_dir }}"
        - "{{ moodle_web_dir }}"
        - "{{ moodle_php_build_dir }}"
        - "{{ moodle_nginx_dir }}"
        - "{{ moodle_ssl_dir }}"

    - name: Render protected Compose environment file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/moodle/templates/env.j2"
        dest: "{{ moodle_root }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Render Compose definition without starting Moodle or Nginx
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/moodle/templates/compose.yml.j2"
        dest: "{{ moodle_root }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Start only the new local MariaDB service
      community.docker.docker_compose_v2:
        project_src: "{{ moodle_root }}"
        services:
          - mariadb
        state: present

    - name: Wait for MariaDB to become ready
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -e
          - "MYSQL_PWD={{ vault_moodle_db_root_password }}"
          - "{{ moodle_container_db }}"
          - mariadb-admin
          - -uroot
          - ping
          - --silent
      register: mariadb_ready
      retries: 30
      delay: 5
      until: mariadb_ready.rc == 0
      changed_when: false
      no_log: true

    - name: Report ready local database without importing source data
      ansible.builtin.debug:
        msg: "Container MariaDB Server A siap. Belum ada SQL source yang diimpor atau data lama yang dihapus."
